name: Government Jobs · Daily Refresh
on:
  push:
    branches: [main]
  schedule:
    # 09:00 India Standard Time (03:30 UTC) every day.
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: govt-job-radar-pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraping libraries
        run: pip install -r requirements.txt
      - name: Test collector
        run: python -m unittest discover -s tests -v
      - name: Read the official recruitment boards
        run: python update_jobs.py
      - name: Save updated snapshot into repository
        run: |
          git config user.name "govt-job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/index.html web/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily government vacancies: $(date -u +%F)"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
